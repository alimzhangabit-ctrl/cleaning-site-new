<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <!-- Background glow -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Glass card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ambient background glow circle -->
  <circle cx="300" cy="250" r="240" fill="url(#heroGlow)" />

  <!-- Abstract clean geometric interior stage -->
  <g filter="url(#softShadow)">
    <rect x="80" y="70" width="440" height="360" rx="28" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
  </g>

  <!-- Modern Clean Living Interior Scene -->
  <!-- Floor base -->
  <path d="M80 340 L520 340 L520 402 A 28 28 0 0 1 492 430 L108 430 A 28 28 0 0 1 80 402 Z" fill="#F8FAFC" />
  <line x1="80" y1="340" x2="520" y2="340" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Clean window in the background -->
  <rect x="120" y="110" width="160" height="150" rx="14" fill="#E0F2FE" />
  <line x1="200" y1="110" x2="200" y2="260" stroke="#FFFFFF" stroke-width="3" />
  <line x1="120" y1="185" x2="280" y2="185" stroke="#FFFFFF" stroke-width="3" />
  <!-- Sunbeams through window -->
  <polygon points="170,110 240,110 330,340 240,340" fill="#FEF9C3" opacity="0.4" />

  <!-- Eco Chemistry Spray Bottle Vector -->
  <g transform="translate(140, 240)">
    <!-- Bottle body -->
    <path d="M25 45 L50 45 L58 110 L17 110 Z" fill="#0D9488" rx="8" />
    <path d="M22 65 L53 65 L56 95 L19 95 Z" fill="#14B8A6" />
    <!-- Spray neck and trigger -->
    <rect x="32" y="30" width="11" height="15" fill="#E2E8F0" />
    <path d="M25 15 L50 15 L50 30 L25 30 Z" fill="#0F172A" rx="3" />
    <path d="M12 22 L25 18 L25 26 Z" fill="#0F172A" />
    <path d="M48 20 Q56 28 52 38" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Spray droplets -->
    <circle cx="5" cy="18" r="2.5" fill="#38BDF8" />
    <circle cx="-5" cy="12" r="3.5" fill="#38BDF8" />
    <circle cx="-3" cy="26" r="2" fill="#38BDF8" />
  </g>

  <!-- Modern Cleaning Vacuum / Mop device -->
  <g transform="translate(340, 160)">
    <!-- Vacuum body sleek cylinder -->
    <rect x="30" y="90" width="48" height="95" rx="14" fill="#0F172A" />
    <rect x="36" y="105" width="36" height="50" rx="8" fill="#0D9488" />
    <!-- Filter gauge ring -->
    <circle cx="54" cy="130" r="10" stroke="#5EEAD4" stroke-width="3" fill="none" />
    <!-- Handle pole -->
    <line x1="54" y1="90" x2="54" y2="10" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" />
    <!-- Handle grip -->
    <path d="M40 10 Q54 0 68 10" stroke="#0F172A" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Base suction head -->
    <ellipse cx="54" cy="185" rx="42" ry="12" fill="#334155" />
    <line x1="20" y1="185" x2="88" y2="185" stroke="#14B8A6" stroke-width="3" />
  </g>

  <!-- Microfiber towels stack -->
  <g transform="translate(235, 305)">
    <rect x="0" y="24" width="70" height="12" rx="4" fill="#0284C7" />
    <rect x="3" y="14" width="64" height="12" rx="4" fill="#10B981" />
    <rect x="6" y="4" width="58" height="12" rx="4" fill="#F59E0B" />
  </g>

  <!-- Floating Trust Badge 1: 100% Безопасность вещей -->
  <g transform="translate(60, 360)" filter="url(#softShadow)">
    <rect width="210" height="56" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="32" cy="28" r="18" fill="#ECFDF5" />
    <path d="M32 18 L38 22 V29 C38 34 32 37 32 37 C32 37 26 34 26 29 V22 Z" fill="#059669" />
    <text x="60" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F172A">Сохранность вещей</text>
    <text x="60" y="40" font-family="system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#059669">100% Гарантия безопасности</text>
  </g>

  <!-- Floating Trust Badge 2: Профессиональная химия -->
  <g transform="translate(330, 80)" filter="url(#softShadow)">
    <rect width="210" height="56" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="32" cy="28" r="18" fill="#F0FDFA" />
    <!-- Sparkle inside icon -->
    <path d="M32 20 L34 26 L40 28 L34 30 L32 36 L30 30 L24 28 L30 26 Z" fill="#0D9488" />
    <text x="60" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F172A">Своя химия и инвентарь</text>
    <text x="60" y="40" font-family="system-ui, sans-serif" font-weight="500" font-size="10.5" fill="#0D9488">Привозим всё с собой</text>
  </g>

  <!-- Clean Sparkle Stars around -->
  <g transform="translate(130, 90)">
    <path d="M0 -10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0 -10 Z" fill="#0D9488" />
  </g>
  <g transform="translate(480, 240)">
    <path d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z" fill="#F59E0B" />
  </g>
  <g transform="translate(300, 390)">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#06B6D4" />
  </g>
</svg>
