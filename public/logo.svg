<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Icon: Sparkle Shield -->
  <g filter="url(#glow)">
    <rect x="4" y="8" width="44" height="44" rx="14" fill="url(#logoGrad)" />
    
    <!-- Sparkle Stars -->
    <path d="M26 14L28.5 22L36.5 24.5L28.5 27L26 35L23.5 27L15.5 24.5L23.5 22Z" fill="#FFFFFF" />
    <path d="M35 32L36.2 36L40.2 37.2L36.2 38.4L35 42.4L33.8 38.4L29.8 37.2L33.8 36Z" fill="#E0F2FE" />
    <circle cx="18" cy="36" r="2.5" fill="#CCFBF1" />
  </g>

  <!-- Typography -->
  <text x="60" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5" fill="#0F172A">
    CLEAN<tspan fill="#0D9488">PRO</tspan>
  </text>
  <text x="61" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.5" fill="#64748B">
    КЛИНИНГОВАЯ КОМПАНИЯ
  </text>
</svg>
